name: DroidInspect Phase 1 Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compile Android app and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile debug APK
        working-directory: droidinspect
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output exists
        run: |
          test -s droidinspect/app/build/outputs/apk/debug/app-debug.apk
          ls -lh droidinspect/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidInspect-Phase1-debug
          path: droidinspect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
