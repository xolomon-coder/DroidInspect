name: DroidInspect Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Host parser tests, Android compile, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test ECMA-335 metadata decoder
        id: metadata_decoder
        run: |
          mkdir -p /tmp/droidinspect-metadata-test
          javac -d /tmp/droidinspect-metadata-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/DotNetMetadataReader.java \
            tools/metadata-reader-test/DotNetMetadataReaderSelfTest.java
          java -cp /tmp/droidinspect-metadata-test com.tanvir.droidinspect.DotNetMetadataReaderSelfTest

      - name: Test embedded .NET resource extraction
        id: embedded_resources
        run: |
          mkdir -p /tmp/droidinspect-resource-test
          javac -d /tmp/droidinspect-resource-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/DotNetResourceExtractor.java \
            tools/resource-extractor-test/DotNetResourceExtractorSelfTest.java
          java -cp /tmp/droidinspect-resource-test com.tanvir.droidinspect.DotNetResourceExtractorSelfTest

      - name: Test .NET IL reader on host JVM
        id: dotnet_il_reader
        run: |
          mkdir -p /tmp/droidinspect-il-test
          javac -d /tmp/droidinspect-il-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/DotNetIlReader.java \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/IlOpcodeExplainer.java \
            tools/il-reader-test/DotNetIlReaderSelfTest.java
          java -cp /tmp/droidinspect-il-test com.tanvir.droidinspect.DotNetIlReaderSelfTest

      - name: Test APK update compatibility assessment
        id: apk_update_compatibility
        run: |
          mkdir -p /tmp/droidinspect-apk-compatibility-test
          javac -d /tmp/droidinspect-apk-compatibility-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/ApkUpdateCompatibility.java \
            tools/apk-update-compatibility-test/ApkUpdateCompatibilitySelfTest.java
          java -cp /tmp/droidinspect-apk-compatibility-test com.tanvir.droidinspect.ApkUpdateCompatibilitySelfTest

      - name: Test assembly comparison diff engine
        id: assembly_comparison
        run: |
          mkdir -p /tmp/droidinspect-comparison-test
          javac -d /tmp/droidinspect-comparison-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/DotNetIlReader.java \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/IlOpcodeExplainer.java \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/AssemblyComparisonDiff.java \
            tools/assembly-comparison-test/AssemblyComparisonDiffSelfTest.java
          java -cp /tmp/droidinspect-comparison-test com.tanvir.droidinspect.AssemblyComparisonDiffSelfTest

      - name: Test persistent project workspace metadata and recovery
        id: workspace_metadata
        run: |
          mkdir -p /tmp/droidinspect-project-workspace-test
          javac -d /tmp/droidinspect-project-workspace-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/ProjectWorkspaceMetadata.java \
            tools/project-workspace-test/ProjectWorkspaceMetadataSelfTest.java
          java -cp /tmp/droidinspect-project-workspace-test com.tanvir.droidinspect.ProjectWorkspaceMetadataSelfTest

      - name: Test project workspace index on host JVM
        id: workspace_index
        run: |
          mkdir -p /tmp/droidinspect-project-index-test
          javac -d /tmp/droidinspect-project-index-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/ProjectWorkspaceIndex.java \
            tools/project-workspace-index-test/ProjectWorkspaceIndexSelfTest.java
          java -cp /tmp/droidinspect-project-index-test com.tanvir.droidinspect.ProjectWorkspaceIndexSelfTest

      - name: Test assembly-scoped bookmark persistence
        id: assembly_bookmarks
        run: |
          mkdir -p /tmp/droidinspect-assembly-bookmarks-test
          javac -d /tmp/droidinspect-assembly-bookmarks-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/AssemblyExplorerBookmarkStore.java \
            tools/assembly-bookmarks-test/AssemblyExplorerBookmarkStoreSelfTest.java
          java -cp /tmp/droidinspect-assembly-bookmarks-test com.tanvir.droidinspect.AssemblyExplorerBookmarkStoreSelfTest

      - name: Test bounded C# source project traversal
        id: bounded_source_tree
        run: |
          mkdir -p /tmp/droidinspect-source-tree-test
          javac -d /tmp/droidinspect-source-tree-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/BoundedSourceTree.java \
            tools/bounded-source-tree-test/BoundedSourceTreeSelfTest.java
          java -cp /tmp/droidinspect-source-tree-test com.tanvir.droidinspect.BoundedSourceTreeSelfTest

      - name: Test bounded APK project file inventories
        id: bounded_project_files
        run: |
          mkdir -p /tmp/droidinspect-bounded-project-files-test
          javac -d /tmp/droidinspect-bounded-project-files-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/BoundedProjectFiles.java \
            tools/bounded-project-files-test/BoundedProjectFilesSelfTest.java
          java -cp /tmp/droidinspect-bounded-project-files-test com.tanvir.droidinspect.BoundedProjectFilesSelfTest

      - name: Test APK workspace replacement and interruption-safe rollback
        id: workspace_transaction
        run: |
          mkdir -p /tmp/droidinspect-workspace-file-transaction-test
          javac -d /tmp/droidinspect-workspace-file-transaction-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/WorkspaceFileTransaction.java \
            tools/project-workspace-file-transaction-test/WorkspaceFileTransactionSelfTest.java
          java -cp /tmp/droidinspect-workspace-file-transaction-test com.tanvir.droidinspect.WorkspaceFileTransactionSelfTest

      - name: Test DEX parser on host JVM
        id: dex_parser
        run: |
          mkdir -p /tmp/droidinspect-dex-test
          javac -d /tmp/droidinspect-dex-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/DexFileParser.java \
            tools/dex-parser-test/DexFileParserSelfTest.java
          java -cp /tmp/droidinspect-dex-test com.tanvir.droidinspect.DexFileParserSelfTest

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Capture resolved release dependency graph
        id: release_dependencies
        working-directory: droidinspect
        run: |
          mkdir -p ../artifacts
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath \
            > ../artifacts/release-runtime-dependencies.txt
          test -s ../artifacts/release-runtime-dependencies.txt

      - name: Compile debug APK
        id: compile_debug
        working-directory: droidinspect
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build unsigned release APK for signing tests
        id: compile_release
        working-directory: droidinspect
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign, verify, and tamper-test APK with Android Build Tools
        id: signing_verification
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="droidinspect/app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p artifacts
          SIGNED="artifacts/droidinspect-ci-signed.apk"
          TAMPERED="/tmp/droidinspect-ci-tampered.apk"
          KS="/tmp/droidinspect-ci-test.p12"
          test -s "$UNSIGNED"
          keytool -genkeypair -noprompt -keystore "$KS" -storetype PKCS12 \
            -storepass "ci-only-password" -keypass "ci-only-password" \
            -alias ci-test -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=DroidInspect CI Test"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KS" --ks-type PKCS12 --ks-key-alias ci-test \
            --ks-pass pass:ci-only-password --key-pass pass:ci-only-password \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$SIGNED" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          jarsigner -verify -verbose -certs "$SIGNED" > /tmp/droidinspect-v1-verify.txt
          grep -iq "jar verified" /tmp/droidinspect-v1-verify.txt
          test -s "$SIGNED"
          python3 - <<'PY'
          import zipfile
          source = "artifacts/droidinspect-ci-signed.apk"
          target = "/tmp/droidinspect-ci-tampered.apk"
          with zipfile.ZipFile(source, "r") as src, zipfile.ZipFile(target, "w") as dst:
              changed = False
              for item in src.infolist():
                  data = src.read(item.filename)
                  if item.filename == "AndroidManifest.xml" and data:
                      data = bytes([data[0] ^ 1]) + data[1:]
                      changed = True
                  dst.writestr(item, data)
              assert changed, "AndroidManifest.xml missing from test APK"
          PY
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$TAMPERED"; then
            echo "ERROR: tampered APK unexpectedly verified"
            exit 1
          else
            echo "PASS: modified APK signature rejected"
          fi
          sha256sum "$SIGNED"
          ls -lh "$SIGNED"

      - name: Verify debug and release APK payload, ABI, offline permissions and size
        id: payload_verification
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="droidinspect/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="droidinspect/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s THIRD-PARTY-NOTICES.md
          if grep -q 'android.permission.INTERNET' droidinspect/app/src/main/AndroidManifest.xml; then
            echo 'ERROR: production source manifest requests Internet permission.'
            exit 1
          fi
          grep -q 'android:allowBackup="false"' droidinspect/app/src/main/AndroidManifest.xml

          mkdir -p artifacts
          find droidinspect/app/src/main/jniLibs -type f -name '*.so' -printf '%P %s bytes\n' \
            | sort | tee artifacts/native-payload-inventory.txt
          NATIVE_BYTES="$(find droidinspect/app/src/main/jniLibs -type f -name '*.so' -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          echo "Native payload bytes: $NATIVE_BYTES" | tee -a artifacts/native-payload-inventory.txt
          test "$NATIVE_BYTES" -le 104857600
          ABI_DIRS="$(find droidinspect/app/src/main/jniLibs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          test "$ABI_DIRS" = "arm64-v8a"

          for APK in "$DEBUG_APK" "$RELEASE_APK"; do
            unzip -t "$APK"
            unzip -l "$APK" > /tmp/droidinspect-apk-list.txt
            grep -q 'lib/arm64-v8a/libdroidinspect_engine.so' /tmp/droidinspect-apk-list.txt
            grep -q 'lib/arm64-v8a/libdroidinspect_jni.so' /tmp/droidinspect-apk-list.txt
            grep -q 'lib/arm64-v8a/libdroidinspect_m12_compiler.so' /tmp/droidinspect-apk-list.txt
            grep -q 'lib/arm64-v8a/libdroidinspect_m12_jni.so' /tmp/droidinspect-apk-list.txt
            if unzip -p "$APK" AndroidManifest.xml | strings | grep -q 'android.permission.INTERNET'; then
              echo "ERROR: $APK requests Internet permission."
              exit 1
            fi
            ls -lh "$APK"
          done

          python3 - "$DEBUG_APK" "$RELEASE_APK" <<'PY'
          import os
          import sys
          import zipfile

          expected = {
              "libdroidinspect_engine.so",
              "libdroidinspect_jni.so",
              "libdroidinspect_m12_compiler.so",
              "libdroidinspect_m12_jni.so",
          }
          with open("artifacts/packaged-native-inventory.txt", "w", encoding="utf-8") as report:
              for apk in sys.argv[1:]:
                  with zipfile.ZipFile(apk) as archive:
                      libs = [entry for entry in archive.infolist()
                              if entry.filename.startswith("lib/") and entry.filename.endswith(".so")]
                      abis = {entry.filename.split("/")[1] for entry in libs
                              if len(entry.filename.split("/")) >= 3}
                      names = {entry.filename.rsplit("/", 1)[-1] for entry in libs}
                      missing = expected - names
                      assert not missing, f"{apk}: missing native libraries: {sorted(missing)}"
                      assert abis == {"arm64-v8a"}, f"{apk}: unexpected native ABI set: {sorted(abis)}"
                      uncompressed = sum(entry.file_size for entry in libs)
                      compressed = sum(entry.compress_size for entry in libs)
                      assert uncompressed <= 104857600, (
                          f"{apk}: packaged native payload exceeds 100 MiB: {uncompressed} bytes")
                      line = (f"{apk}: APK={os.path.getsize(apk)} bytes; ABI={','.join(sorted(abis))}; "
                              f"native={uncompressed} bytes uncompressed / {compressed} bytes compressed")
                      print(line)
                      report.write(line + "\\n")
                      for entry in sorted(libs, key=lambda item: item.filename):
                          detail = (f"  {entry.filename}: {entry.file_size} bytes uncompressed / "
                                    f"{entry.compress_size} bytes compressed")
                          print(detail)
                          report.write(detail + "\\n")
          PY

          sha256sum "$DEBUG_APK" "$RELEASE_APK" artifacts/droidinspect-ci-signed.apk \
            | tee artifacts/SHA256SUMS.txt
      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "# DroidInspect CI verification"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Overall job: **${{ job.status }}**"
            echo
            echo "| Verification | Result |"
            echo "|---|---|"
            echo "| ECMA-335 metadata decoder | ${{ steps.metadata_decoder.outcome || 'skipped' }} |"
            echo "| Embedded .NET resources | ${{ steps.embedded_resources.outcome || 'skipped' }} |"
            echo "| .NET IL reader | ${{ steps.dotnet_il_reader.outcome || 'skipped' }} |"
            echo "| APK update compatibility | ${{ steps.apk_update_compatibility.outcome || 'skipped' }} |"
            echo "| Assembly comparison | ${{ steps.assembly_comparison.outcome || 'skipped' }} |"
            echo "| Workspace metadata/recovery | ${{ steps.workspace_metadata.outcome || 'skipped' }} |"
            echo "| Workspace index | ${{ steps.workspace_index.outcome || 'skipped' }} |"
            echo "| Assembly bookmarks | ${{ steps.assembly_bookmarks.outcome || 'skipped' }} |"
            echo "| Bounded C# source traversal | ${{ steps.bounded_source_tree.outcome || 'skipped' }} |"
            echo "| Bounded APK inventories | ${{ steps.bounded_project_files.outcome || 'skipped' }} |"
            echo "| Workspace transaction/rollback | ${{ steps.workspace_transaction.outcome || 'skipped' }} |"
            echo "| DEX parser | ${{ steps.dex_parser.outcome || 'skipped' }} |"
            echo "| Release dependency resolution | ${{ steps.release_dependencies.outcome || 'skipped' }} |"
            echo "| Android debug compilation | ${{ steps.compile_debug.outcome || 'skipped' }} |"
            echo "| Android release compilation | ${{ steps.compile_release.outcome || 'skipped' }} |"
            echo "| APK signing/tamper verification | ${{ steps.signing_verification.outcome || 'skipped' }} |"
            echo "| APK payload/ABI/security checks | ${{ steps.payload_verification.outcome || 'skipped' }} |"
            echo
            echo "APK files and temporary audit outputs are not uploaded. Runner-local build outputs are discarded when the job ends."
          } >> "$GITHUB_STEP_SUMMARY"
