name: DroidInspect Phase 1 Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compile Android app and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test ECMA-335 metadata decoder on host JVM
        run: |
          mkdir -p /tmp/droidinspect-metadata-test
          javac -d /tmp/droidinspect-metadata-test \
            droidinspect/app/src/main/java/com/tanvir/droidinspect/DotNetMetadataReader.java \
            tools/metadata-reader-test/DotNetMetadataReaderSelfTest.java
          java -cp /tmp/droidinspect-metadata-test com.tanvir.droidinspect.DotNetMetadataReaderSelfTest

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile debug APK
        working-directory: droidinspect
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output exists and record provenance
        run: |
          test -s droidinspect/app/build/outputs/apk/debug/app-debug.apk
          ls -lh droidinspect/app/build/outputs/apk/debug/app-debug.apk
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Branch/ref: $GITHUB_REF"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Build type: debug"
            echo "Android compile SDK: 36"
            echo "Gradle: 8.13"
          } > droidinspect-build-info.txt

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidInspect-Phase1-debug
          path: droidinspect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
