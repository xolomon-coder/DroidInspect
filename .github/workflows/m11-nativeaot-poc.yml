name: M11 ILSpy Native AOT Android Proof
# [publish-m11-assets] Final source batch: publish the generated ARM64 engine and offline DLL assets for local CodeAssist builds.
# The JNI loader SONAME is checked to prevent absolute DT_NEEDED paths.
# The committed CodeAssist payload is also rebuilt and revalidated by normal main-branch runs.
on:
  push:
    branches: [ main ]
    paths:
      - 'tools/m11-poc/**'
      - '.github/workflows/m11-nativeaot-poc.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-verify:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[m11-assets]')
    name: Fixture, real assembly, ILSpy, Native AOT, JNI and APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build managed fixture
        run: dotnet build tools/m11-poc/fixture/DecompilerFixture.csproj -c Release
      - name: Run managed ILSpy C# fixture test
        run: |
          REF="$DOTNET_ROOT/packs/Microsoft.NETCore.App.Ref/11.0.0/ref/net11.0"
          test -f "$REF/System.Runtime.dll"
          dotnet run --project tools/m11-poc/host-tests/HostTests.csproj -c Release -- "$GITHUB_WORKSPACE/tools/m11-poc/fixture/bin/Release/net11.0/DecompilerFixture.dll" "$REF"
      - name: Build and decompile managed EXE input
        run: |
          set -euo pipefail
          REF="$DOTNET_ROOT/packs/Microsoft.NETCore.App.Ref/11.0.0/ref/net11.0"
          dotnet build tools/m11-poc/exe-fixture/ExeFixture.csproj -c Release
          mkdir -p /tmp/m11-exe
          cp tools/m11-poc/exe-fixture/bin/Release/net11.0/ExeFixture.dll /tmp/m11-exe/ExeFixture.exe
          dotnet run --project tools/m11-poc/exe-tests/ExeTests.csproj -c Release -- /tmp/m11-exe/ExeFixture.exe "$REF"
      - name: Run invalid-input and repeatability robustness tests
        run: |
          REF="$DOTNET_ROOT/packs/Microsoft.NETCore.App.Ref/11.0.0/ref/net11.0"
          dotnet run --project tools/m11-poc/robustness-tests/RobustnessTests.csproj -c Release -- "$GITHUB_WORKSPACE/tools/m11-poc/fixture/bin/Release/net11.0/DecompilerFixture.dll" "$REF"
      - name: Download independent real-world managed assembly
        run: |
          set -euo pipefail
          mkdir -p /tmp/m11-newtonsoft
          curl --fail --location --retry 3 --output /tmp/m11-newtonsoft/newtonsoft.json.13.0.3.nupkg https://api.nuget.org/v3-flatcontainer/newtonsoft.json/13.0.3/newtonsoft.json.13.0.3.nupkg
          unzip -p /tmp/m11-newtonsoft/newtonsoft.json.13.0.3.nupkg lib/netstandard2.0/Newtonsoft.Json.dll > /tmp/m11-newtonsoft/Newtonsoft.Json.dll
          test -s /tmp/m11-newtonsoft/Newtonsoft.Json.dll
          file /tmp/m11-newtonsoft/Newtonsoft.Json.dll
          sha256sum /tmp/m11-newtonsoft/Newtonsoft.Json.dll
      - name: Run ILSpy real-world assembly reconstruction test
        run: |
          REF="$DOTNET_ROOT/packs/Microsoft.NETCore.App.Ref/11.0.0/ref/net11.0"
          dotnet run --project tools/m11-poc/real-assembly-tests/RealAssemblyTests.csproj -c Release -- /tmp/m11-newtonsoft/Newtonsoft.Json.dll "$REF"
      - name: Decompile independent System.Text.Json runtime assembly
        run: |
          set -euo pipefail
          REF="$DOTNET_ROOT/packs/Microsoft.NETCore.App.Ref/11.0.0/ref/net11.0"
          JSON_DLL="$(find "$DOTNET_ROOT/shared/Microsoft.NETCore.App" -name System.Text.Json.dll -print | sort -V | tail -n 1)"
          test -s "$JSON_DLL"
          file "$JSON_DLL"
          dotnet run --project tools/m11-poc/framework-assembly-tests/FrameworkAssemblyTests.csproj -c Release -- "$JSON_DLL" "$(dirname "$JSON_DLL"):$REF"
      - name: Run real-world third-party dependency resolution tests
        run: |
          set -euo pipefail
          REF="$DOTNET_ROOT/packs/Microsoft.NETCore.App.Ref/11.0.0/ref/net11.0"
          dotnet run --project tools/m11-poc/dependency-assembly-tests/DependencyAssemblyTests.csproj -c Release -- "$REF"
      - name: Publish Native AOT Bionic ARM64 engine
        env:
          CC: clang
          CXX: clang++
          AR: llvm-ar
          LD: ld.lld
        run: |
          dotnet publish tools/m11-poc/engine/DroidInspect.M11.Engine.csproj -c Release -r linux-bionic-arm64 -p:DisableUnsupportedError=true -p:PublishAotUsingRuntimePack=true -p:StripSymbols=false
      - name: Reject the built native ELF as a non-managed input
        run: |
          set -euo pipefail
          REF="$DOTNET_ROOT/packs/Microsoft.NETCore.App.Ref/11.0.0/ref/net11.0"
          LIB="$(find tools/m11-poc/engine/bin/Release/net11.0/linux-bionic-arm64/publish -maxdepth 1 -name "*.so" -print -quit)"
          test -s "$LIB"
          dotnet run --project tools/m11-poc/robustness-tests/RobustnessTests.csproj -c Release -- "$GITHUB_WORKSPACE/tools/m11-poc/fixture/bin/Release/net11.0/DecompilerFixture.dll" "$REF" "$GITHUB_WORKSPACE/$LIB"
      - name: Verify ARM64 ELF and native exports
        run: |
          set -euo pipefail
          LIB="$(find tools/m11-poc/engine/bin/Release/net11.0/linux-bionic-arm64/publish -maxdepth 1 -name '*.so' -print -quit)"
          test -n "$LIB" && test -s "$LIB"
          file "$LIB"
          readelf -h "$LIB" | tee /tmp/m11-elf-header.txt
          grep -q AArch64 /tmp/m11-elf-header.txt
          llvm-nm -D --defined-only "$LIB" | tee /tmp/m11-exports.txt
          grep -q DroidInspect_DecompileFile /tmp/m11-exports.txt
          grep -q DroidInspect_FreeResult /tmp/m11-exports.txt
          readelf -d "$LIB" | tee /tmp/m11-engine-needed.txt
          grep -Fq 'Library soname: [libdroidinspect_engine.so]' /tmp/m11-engine-needed.txt
          mkdir -p artifacts
          cp "$LIB" artifacts/libdroidinspect_engine.so
      - name: Prepare ARM64 engine, offline references and real test assembly
        run: |
          set -euo pipefail
          MAIN="tools/m11-poc/android-host/app/src/main"
          mkdir -p "$MAIN/jniLibs/arm64-v8a" "$MAIN/assets/reference-assemblies/net11.0" "$MAIN/assets/test-assemblies"
          cp artifacts/libdroidinspect_engine.so "$MAIN/jniLibs/arm64-v8a/"
          REF="$DOTNET_ROOT/packs/Microsoft.NETCore.App.Ref/11.0.0/ref/net11.0"
          test -d "$REF"
          find "$REF" -maxdepth 1 -type f -name '*.dll' -exec cp -t "$MAIN/assets/reference-assemblies/net11.0/" {} +
          cp /tmp/m11-newtonsoft/Newtonsoft.Json.dll "$MAIN/assets/test-assemblies/"
          cp /tmp/m11-newtonsoft/Newtonsoft.Json.dll artifacts/
          DEP_OUT="tools/m11-poc/dependency-assembly-tests/bin/Release/net11.0"
          test -s "$DEP_OUT/Serilog.Extensions.Logging.dll"
          cp "$DEP_OUT/Serilog.Extensions.Logging.dll" "$MAIN/assets/test-assemblies/"
          cp "$DEP_OUT/Serilog.Extensions.Logging.dll" artifacts/
          mkdir -p "$MAIN/assets/dependency-references"
          for dll in "$DEP_OUT"/*.dll; do
            name="$(basename "$dll")"
            case "$name" in
              Serilog.Extensions.Logging.dll|DependencyAssemblyTests.dll|ICSharpCode.Decompiler.dll|System.*|System.dll|mscorlib.dll|netstandard.dll) continue ;;
            esac
            cp "$dll" "$MAIN/assets/dependency-references/"
          done
          test -s "$MAIN/assets/dependency-references/Serilog.dll"
          test -s "$MAIN/assets/dependency-references/Microsoft.Extensions.Logging.dll"
          test -s "$MAIN/assets/dependency-references/Microsoft.Extensions.DependencyInjection.dll"
          cp tools/m11-poc/fixture/bin/Release/net11.0/DecompilerFixture.dll artifacts/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build isolated Java XML proof APK
        working-directory: tools/m11-poc/android-host
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK payload
        run: |
          set -euo pipefail
          APK="tools/m11-poc/android-host/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | tee /tmp/m11-apk-list.txt
          unzip -p "$APK" lib/arm64-v8a/libdroidinspect_jni.so > /tmp/m11-jni.so
          readelf -d /tmp/m11-jni.so | tee /tmp/m11-jni-needed.txt
          grep -Fq 'Shared library: [libdroidinspect_engine.so]' /tmp/m11-jni-needed.txt
          if grep -Eq 'Shared library: [/' /tmp/m11-jni-needed.txt; then echo 'ERROR: JNI contains an absolute DT_NEEDED path'; exit 1; fi
          grep -q 'lib/arm64-v8a/libdroidinspect_engine.so' /tmp/m11-apk-list.txt
          grep -q 'lib/arm64-v8a/libdroidinspect_jni.so' /tmp/m11-apk-list.txt
          grep -q 'assets/reference-assemblies/net11.0/System.Runtime.dll' /tmp/m11-apk-list.txt
          grep -q 'assets/test-assemblies/Newtonsoft.Json.dll' /tmp/m11-apk-list.txt
          grep -q 'assets/test-assemblies/Serilog.Extensions.Logging.dll' /tmp/m11-apk-list.txt
          grep -q 'assets/dependency-references/Serilog.dll' /tmp/m11-apk-list.txt
          grep -q 'assets/dependency-references/Microsoft.Extensions.Logging.dll' /tmp/m11-apk-list.txt
          grep -q 'assets/dependency-references/Microsoft.Extensions.DependencyInjection.dll' /tmp/m11-apk-list.txt
          mkdir -p artifacts
          cp "$APK" artifacts/DroidInspect-M11-Android-Proof.apk
          sha256sum artifacts/*
          ls -lh artifacts
      - name: Commit generated offline Android build payload to main
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-m11-assets]')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/m11-poc/android-host/app/src/main/jniLibs/arm64-v8a/libdroidinspect_engine.so
          git add tools/m11-poc/android-host/app/src/main/assets/reference-assemblies/net11.0
          git add tools/m11-poc/android-host/app/src/main/assets/test-assemblies
          git add tools/m11-poc/android-host/app/src/main/assets/dependency-references
          if git diff --cached --quiet; then
            echo "Generated CodeAssist payload is already current."
            exit 0
          fi
          git commit -m "[m11-assets] Add generated ARM64 engine and offline assets for CodeAssist"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: DroidInspect-M11-Android-Proof
          path: |
            artifacts/DroidInspect-M11-Android-Proof.apk
            artifacts/libdroidinspect_engine.so
            artifacts/DecompilerFixture.dll
            artifacts/Newtonsoft.Json.dll
            /tmp/m11-elf-header.txt
            /tmp/m11-exports.txt
            /tmp/m11-engine-needed.txt
            /tmp/m11-jni-needed.txt
            /tmp/m11-apk-list.txt
          if-no-files-found: error
          retention-days: 14
